services:
  # FastAPI Web Service
  - type: web
    name: paypilot-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://paypilot-frontend.onrender.com
      - key: SESSION_SIGNING_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false

  # Vite React Static Site
  - type: web
    name: paypilot-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paypilot-backend.onrender.com
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false

databases:
  - name: paypilot-db
    databaseName: paypilot
    user: paypilot_user
    plan: free
